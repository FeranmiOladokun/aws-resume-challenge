name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "vendor/**"
      - "LICENSE"
      - ".github/workflows/frontend-cicd.yaml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload website files
        run: |
          aws s3 cp index.html s3://aws-s3-challenge-feranmi/index.html
          aws s3 sync css/ s3://aws-s3-challenge-feranmi/css/
          aws s3 sync js/ s3://aws-s3-challenge-feranmi/js/
          aws s3 sync vendor/ s3://aws-s3-challenge-feranmi/vendor/
          aws s3 cp LICENSE s3://aws-s3-challenge-feranmi/LICENSE

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1VN2CM8LALMZE \
            --paths "/*"